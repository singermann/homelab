---
- name: System aktualisieren
  hosts: homelab
  become: true

  tasks:
    - name: Debian – Paketquellen aktualisieren und Updates einspielen
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Rocky – Updates einspielen
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"
