# SSH-Härtung – Homelab
# Ziel: /etc/ssh/sshd_config.d/10-hardening.conf
# "10-" sorgt dafür, dass die Datei vor 50-cloud-init.conf / 50-redhat.conf
# gelesen wird – bei sshd gilt der ERSTE gefundene Wert.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
GSSAPIAuthentication no
PubkeyAuthentication yes
AllowUsers sven
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
