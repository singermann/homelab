#!/usr/sbin/nft -f
# Firewall – Homelab (Debian): eingehend nur SSH, Ping und Antworten
# Ziel: /etc/nftables.conf  –  aktivieren: systemctl enable --now nftables

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept     # Antworten auf eigene Verbindungen
    ct state invalid drop
    iif "lo" accept                          # lokale Kommunikation
    meta l4proto { icmp, ipv6-icmp } accept  # Ping, IPv6-Nachbarsuche
    udp dport 68 accept                      # DHCP-Antworten
    tcp dport 22 accept                      # SSH
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
